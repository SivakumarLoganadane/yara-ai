<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YARA AI">
  <!--
    YARA AI mark: a dark glass orb with champagne rim light and a flowing
    gold light wave. Original artwork for YARA AI; no text, so it reads at
    favicon size as well as in the sidebar.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#E5AD65" stop-opacity="0.42"/>
      <stop offset="0.88" stop-color="#E5AD65" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E5AD65" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="body" cx="50%" cy="46%" r="56%">
      <stop offset="0" stop-color="#020306"/>
      <stop offset="0.72" stop-color="#05060b"/>
      <stop offset="0.9" stop-color="#120e09"/>
      <stop offset="1" stop-color="#3d2a12"/>
    </radialGradient>

    <!-- warm light scattered inside the glass, strongest along the wave -->
    <radialGradient id="inner" cx="68%" cy="40%" r="58%">
      <stop offset="0" stop-color="#F4C982" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#E5AD65" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E5AD65" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner2" cx="18%" cy="74%" r="40%">
      <stop offset="0" stop-color="#C98A45" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#C98A45" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.9" stop-color="#F4C982" stop-opacity="0"/>
      <stop offset="0.975" stop-color="#F4C982" stop-opacity="0.55"/>
      <stop offset="0.995" stop-color="#FFF0D4" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFF0D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave" x1="0.05" y1="0.75" x2="0.95" y2="0.2">
      <stop offset="0" stop-color="#C98A45" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#E5AD65" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F4C982"/>
      <stop offset="0.7" stop-color="#FFF0D4"/>
      <stop offset="0.88" stop-color="#F4C982" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E5AD65" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <clipPath id="sphere">
      <circle cx="256" cy="256" r="196"/>
    </clipPath>
  </defs>

  <!-- warm glow around the orb -->
  <circle cx="256" cy="256" r="250" fill="url(#halo)"/>

  <!-- the dark glass sphere -->
  <circle cx="256" cy="256" r="196" fill="url(#body)"/>

  <g clip-path="url(#sphere)">
    <circle cx="256" cy="256" r="196" fill="url(#inner)"/>
    <circle cx="256" cy="256" r="196" fill="url(#inner2)"/>

    <!-- the light wave: wide bloom, glowing body, sharp ribbon, bright core -->
    <path d="M40 350 C170 330 300 250 478 132 C320 292 180 346 40 350 Z"
          fill="url(#wave)" filter="url(#bloom)"/>
    <path d="M40 350 C170 330 300 250 478 132 C320 292 180 346 40 350 Z"
          fill="url(#wave)" filter="url(#glow)" opacity="0.9"/>
    <path d="M40 350 C170 330 300 250 478 132 C320 292 180 346 40 350 Z"
          fill="url(#wave)" filter="url(#soft)" opacity="0.95"/>
    <path d="M70 344 C190 326 300 262 462 146"
          fill="none" stroke="#FFF0D4" stroke-width="5" stroke-linecap="round"
          filter="url(#soft)"/>
  </g>

  <!-- golden edge light -->
  <circle cx="256" cy="256" r="197" fill="url(#rim)"/>
</svg>
